name: ci-m0-probe

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-m0-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 30.0.16248370

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate scripts
        run: |
          set -euo pipefail
          bash -n scripts/probe_device.sh
          node --check scripts/dso_x18_scan.mjs
          node scripts/dso_x18_scan.mjs --self-test

      - name: Locate NDK
        run: |
          set -euo pipefail
          echo "NDK=/usr/local/lib/android/sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          test -x "/usr/local/lib/android/sdk/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            || { echo "NDK $NDK_VERSION missing from runner image"; exit 1; }
          "/usr/local/lib/android/sdk/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build m0_probe
        run: |
          set -euo pipefail
          mkdir -p dist/m0_probe
          cc="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          "$cc" -O2 -g -Wall -Wextra -Werror \
            -ffixed-x18 -fno-sanitize=shadow-call-stack \
            -march=armv8.2-a+lse \
            -o dist/m0_probe/m0_probe native/tools/m0_probe/m0_probe.c
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h dist/m0_probe/m0_probe

      - name: Assert no SCS prologues in self-built binary
        run: node scripts/dso_x18_scan.mjs --expect-zero dist/m0_probe/m0_probe

      - name: Validate scanner against encoded SCS words
        run: |
          set -euo pipefail
          mkdir -p dist/scs_canary
          cc="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          objdump="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          "$cc" -shared -nostdlib -fPIC -o dist/scs_canary/scs_canary.so \
            native/tools/m0_probe/scs_canary.S
          "$objdump" -d dist/scs_canary/scs_canary.so | grep -E 'x18'
          "$objdump" -d dist/scs_canary/scs_canary.so | grep -q 'str.*x18, \[x18\], #0x8' \
            || { echo "encoder mismatch: push"; exit 1; }
          "$objdump" -d dist/scs_canary/scs_canary.so | grep -q 'ldr.*x18' \
            || { echo "encoder mismatch: pop"; exit 1; }
          node scripts/dso_x18_scan.mjs dist/scs_canary/scs_canary.so | tee /tmp/canary.json
          grep -q '"scs_push":1' /tmp/canary.json || { echo "scanner missed SCS"; exit 1; }

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist/m0_probe
          sha256sum m0_probe > m0_probe.sha256
          cat m0_probe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: m0-probe-arm64
          path: dist/m0_probe/
          if-no-files-found: error
          retention-days: 30
