name: ci-m3-loader

on:
  push:
    branches:
      - main
      - m3/vk-loader
    paths:
      - deps/vulkan-loader.sh
      - deps/patches/vulkan-loader/**
      - native/tools/vk_loader_test/**
      - tests/vk/loader_run.sh
      - .github/workflows/ci-m3-loader.yml
  workflow_dispatch:
    inputs:
      gpu_run_id:
        description: ci-deps-gpu run id that produced the radv-xclipse artifact
        required: false
        default: ""

concurrency:
  group: ci-m3-loader-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NDK_VERSION: 30.0.16248370
  LOADER_TAG: vulkan-sdk-1.4.363.0
  LOADER_COMMIT: fa218055ff4948b159f31d43f800c808a13d51df
  HEADERS_TAG: vulkan-sdk-1.4.363.0
  HEADERS_COMMIT: 6802bb4733b63ed5efd3adb308a6c885ef180ea1

jobs:
  loader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Locate NDK
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_BIN=/usr/local/lib/android/sdk/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          test -x "/usr/local/lib/android/sdk/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            || { echo "NDK $NDK_VERSION missing from runner image"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Fetch Vulkan-Headers
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$HEADERS_TAG" \
            https://github.com/KhronosGroup/Vulkan-Headers.git src/vulkan-headers
          test "$(git -C src/vulkan-headers rev-parse HEAD)" = "$HEADERS_COMMIT" || {
            echo "Vulkan-Headers commit mismatch"; exit 1;
          }
          cmake -S src/vulkan-headers -B build/vulkan-headers -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/vulkan-headers-prefix" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --install build/vulkan-headers
          test -f build/vulkan-headers-prefix/share/cmake/VulkanHeaders/VulkanHeadersConfig.cmake

      - name: Fetch Vulkan-Loader
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$LOADER_TAG" \
            https://github.com/KhronosGroup/Vulkan-Loader.git src/vulkan-loader
          test "$(git -C src/vulkan-loader rev-parse HEAD)" = "$LOADER_COMMIT" || {
            echo "Vulkan-Loader commit mismatch"; exit 1;
          }
          for p in deps/patches/vulkan-loader/*.patch; do
            patch -d src/vulkan-loader -p1 --forward --batch < "$p"
          done
          test -z "$(find src/vulkan-loader -name '*.rej')" || { echo "patch rejects"; exit 1; }
          grep -q 'BUILD_WSI_ANDROID_SUPPORT' src/vulkan-loader/CMakeLists.txt

      - name: Build loader
        env:
          VULKAN_LOADER_SRC: ${{ github.workspace }}/src/vulkan-loader
          VULKAN_HEADERS_PREFIX: ${{ github.workspace }}/build/vulkan-headers-prefix
          VULKAN_LOADER_OUT: ${{ github.workspace }}/build/vulkan-loader-out
        run: |
          set -euo pipefail
          bash deps/vulkan-loader.sh
          ls -l build/vulkan-loader-out/dist/

      - name: Build vk_loader_test
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="$TOOLCHAIN_BIN"
          cc="$BIN/aarch64-linux-android34-clang"
          "$cc" -O2 -Wall -Wextra -fPIE -pie \
            -ffixed-x18 -fno-sanitize=shadow-call-stack \
            -march=armv8.2-a+lse \
            -Wl,--dynamic-linker=/system/bin/linker64 \
            -I "$PWD/build/vulkan-headers-prefix/include" \
            -o build/vk_loader_test native/tools/vk_loader_test/vk_loader_test.c -ldl
          "$BIN/llvm-strip" --strip-unneeded -o dist/vk_loader_test build/vk_loader_test
          "$BIN/llvm-readelf" -h -l dist/vk_loader_test > dist/vk_loader_test.elf.txt
          grep -q 'AArch64' dist/vk_loader_test.elf.txt \
            || { echo "vk_loader_test is not AArch64"; exit 1; }
          grep -q 'Type:.*DYN' dist/vk_loader_test.elf.txt \
            || { echo "vk_loader_test is not a PIE"; exit 1; }
          grep -q 'Requesting program interpreter: /system/bin/linker64' dist/vk_loader_test.elf.txt \
            || { echo "vk_loader_test has no Android dynamic linker"; exit 1; }
          "$BIN/llvm-readelf" -dW dist/vk_loader_test > dist/vk_loader_test.dyn.txt
          if grep -q 'libvulkan' dist/vk_loader_test.dyn.txt; then
            echo "vk_loader_test must not link libvulkan"
            exit 1
          fi
          if grep -nE '\b(setenv|putenv|unsetenv)[[:space:]]*\(' \
               native/tools/vk_loader_test/vk_loader_test.c; then
            echo "vk_loader_test must not set the loader environment"
            exit 1
          fi
          node scripts/dso_x18_scan.mjs --expect-zero dist/vk_loader_test

      - name: Resolve ci-deps-gpu run
        id: gpu
        env:
          GH_TOKEN: ${{ github.token }}
          GPU_RUN_ID: ${{ inputs.gpu_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$GPU_RUN_ID" ]; then
            id=$GPU_RUN_ID
          else
            if ! id=$(gh run list --workflow ci-deps-gpu.yml --status success --limit 1 \
                         --json databaseId --jq '.[0].databaseId // empty' 2>&1); then
              echo "::error::ci-deps-gpu workflow lookup failed: $id"
              exit 1
            fi
          fi
          if [ -z "$id" ]; then
            echo "::error::no successful ci-deps-gpu run; pass gpu_run_id once radv-xclipse exists"
            exit 1
          fi
          state=$(gh run view "$id" --json status,conclusion --jq '"\(.status)/\(.conclusion)"')
          if [ "$state" != "completed/success" ]; then
            # Only radv matters here; a failed sibling job still ships its artifact.
            radv=$(gh run view "$id" --json jobs \
              --jq '.jobs[] | select(.name == "radv") | "\(.status)/\(.conclusion)"')
            if [ "$radv" != "completed/success" ]; then
              echo "::error::ci-deps-gpu run $id is $state and its radv job is ${radv:-absent}"
              exit 1
            fi
            echo "run $id is $state but its radv job succeeded"
          fi
          sha=$(gh run view "$id" --json headSha --jq .headSha)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "gpu run $id head $sha"

      - name: Download radv-xclipse
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.gpu.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p dist/icd
          if ! gh run download "$RUN_ID" -n radv-xclipse -D dist/icd; then
            echo "artifact radv-xclipse missing from run $RUN_ID"
            gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[].name' || true
            exit 1
          fi
          find dist/icd -type f -printf '%p %s\n'

      - name: Extract ICD
        run: |
          set -euo pipefail
          so=$(find dist/icd -type f \( -name 'vulkan.radeon.so' -o -name 'libvulkan_radeon.so' \) | head -n1)
          if [ -z "$so" ]; then
            mkdir -p dist/icd-unpack
            while IFS= read -r archive; do
              case "$archive" in
                *.tar.zst) tar --zstd -xf "$archive" -C dist/icd-unpack ;;
                *.tar.gz|*.tgz) tar -xzf "$archive" -C dist/icd-unpack ;;
                *.tar.xz) tar -xJf "$archive" -C dist/icd-unpack ;;
                *.tar) tar -xf "$archive" -C dist/icd-unpack ;;
              esac
            done < <(find dist/icd -type f \( -name '*.tar.zst' -o -name '*.tar.gz' \
              -o -name '*.tgz' -o -name '*.tar.xz' -o -name '*.tar' \))
            so=$(find dist/icd-unpack -type f \( -name 'vulkan.radeon.so' -o -name 'libvulkan_radeon.so' \) | head -n1)
          fi
          if [ -z "$so" ]; then
            echo "radv-xclipse artifact has no vulkan.radeon.so"
            find dist/icd -type f -printf '%p\n'
            exit 1
          fi
          cp "$so" dist/vulkan.radeon.so
          ls -l dist/vulkan.radeon.so

      - name: Check ICD
        run: |
          set -euo pipefail
          BIN="$TOOLCHAIN_BIN"
          "$BIN/llvm-readelf" -h dist/vulkan.radeon.so > dist/vulkan.radeon.elf.txt
          grep -q 'AArch64' dist/vulkan.radeon.elf.txt \
            || { echo "ICD is not AArch64"; exit 1; }
          "$BIN/llvm-readelf" --dyn-syms -W dist/vulkan.radeon.so > dist/vulkan.radeon.syms.txt
          grep -q 'vk_icdGetInstanceProcAddr' dist/vulkan.radeon.syms.txt \
            || { echo "ICD does not export vk_icdGetInstanceProcAddr"; exit 1; }

      - name: Package
        env:
          GPU_RUN_ID: ${{ steps.gpu.outputs.id }}
          GPU_SHA: ${{ steps.gpu.outputs.sha }}
        run: |
          set -euo pipefail
          BIN="$TOOLCHAIN_BIN"
          cp build/vulkan-loader-out/dist/libvulkan.so dist/libvulkan.so
          cp tests/vk/loader_run.sh dist/run.sh
          chmod +x dist/run.sh dist/vk_loader_test
          "$BIN/llvm-readelf" -dW dist/libvulkan.so > dist/libvulkan.dyn.txt
          needed=$("$BIN/llvm-readelf" -dW dist/libvulkan.so |
            sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | tr '\n' ' ' | sed 's/ $//')
          case " $needed " in
            *" libdl.so "*) ;;
            *) echo "libvulkan.so does not link libdl.so"; exit 1 ;;
          esac
          case " $needed " in
            *" libc.so "*) ;;
            *) echo "libvulkan.so does not link libc.so"; exit 1 ;;
          esac
          loader_sha=$(sha256sum dist/libvulkan.so | cut -d' ' -f1)
          test_sha=$(sha256sum dist/vk_loader_test | cut -d' ' -f1)
          icd_sha=$(sha256sum dist/vulkan.radeon.so | cut -d' ' -f1)
          jq -n \
            --arg loader_sha "$loader_sha" \
            --arg test_sha "$test_sha" \
            --arg icd_sha "$icd_sha" \
            --arg loader_tag "$LOADER_TAG" \
            --arg loader_commit "$LOADER_COMMIT" \
            --arg headers_tag "$HEADERS_TAG" \
            --arg headers_commit "$HEADERS_COMMIT" \
            --arg needed "$needed" \
            --arg gpu_run "$GPU_RUN_ID" \
            --arg gpu_sha "$GPU_SHA" \
            --arg commit "$GITHUB_SHA" \
            --arg ndk "$NDK_VERSION" \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{loader:"libvulkan.so",loader_sha256:$loader_sha,loader_tag:$loader_tag,
              loader_commit:$loader_commit,headers_tag:$headers_tag,
              headers_commit:$headers_commit,loader_needed:$needed,
              test:"vk_loader_test",test_sha256:$test_sha,icd:"vulkan.radeon.so",
              icd_sha256:$icd_sha,gpu_run_id:$gpu_run,gpu_head_sha:$gpu_sha,
              commit:$commit,ndk:$ndk,built_utc:$built}' > dist/meta.json
          cat dist/meta.json
          test ! -e dist/vulkan.radeon.json
          tar -C dist -czf dist/titan-m3-loader.tar.gz \
            libvulkan.so vk_loader_test vulkan.radeon.so run.sh meta.json
          tar -tzf dist/titan-m3-loader.tar.gz > dist/tar.txt
          if grep -q 'vulkan.radeon.json' dist/tar.txt; then
            echo "ICD JSON must be written on the device, not packaged"
            exit 1
          fi
          ls -l dist/titan-m3-loader.tar.gz
          sha256sum dist/titan-m3-loader.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: titan-m3-loader
          path: |
            dist/titan-m3-loader.tar.gz
            dist/meta.json
          if-no-files-found: error
          retention-days: 30
