plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'org.winehq.wine'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.titan.nt'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '0.1'
    }

    // one fixed key: a per-runner debug key rejects install -r over the last build
    signingConfigs {
        debug {
            storeFile file('titan-debug.jks')
            storePassword 'titandebug'
            keyAlias 'titan'
            keyPassword 'titandebug'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
